; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
platform = atmelavr
board = attiny85

; Note: To activate the CPU frequency, the changed fuses have to be set (once) explicitly with PlatformIO "Set Fuses" command.
; Otherwise the CPU will continue acting on its (1MHz) default or the previously set value !!
board_build.f_cpu = 8000000L ; DHT protocol requires 8MHz to operate correctly
; For fuses see https://www.engbedded.com/fusecalc/
; Fuses have to be set (once) explicitly with Platformio "Set Fuses" command!!
board_fuses.lfuse = 0xE2 ; with 1MHz (default) it is 0x62
board_fuses.hfuse = 0xDF ; default
board_fuses.efuse = 0xFF ; default

; common build flags
build_flags =

; upload_protocol = ehajo-isp ; to be used for devices with VCC < 3,3V - but can be used for others too
upload_protocol = usbtiny ; usable for devices with VCC >= 3,3V

;##############################################################################

[env:DEV]
build_flags =
  ${env.build_flags}
